<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .calculator {
    width: 320px;
    background: #1e1e2f;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  .display {
    background: #12121c;
    border-radius: 16px;
    padding: 20px 16px;
    margin-bottom: 20px;
    text-align: right;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  .expression {
    color: #8a8aa0;
    font-size: 16px;
    min-height: 22px;
    word-break: break-all;
  }

  .result {
    color: #ffffff;
    font-size: 40px;
    font-weight: 300;
    word-break: break-all;
    line-height: 1.2;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    border: none;
    border-radius: 50%;
    height: 62px;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.1s, filter 0.1s;
    color: #fff;
    background: #2a2a3d;
    user-select: none;
  }

  button:hover {
    filter: brightness(1.2);
  }

  button:active {
    transform: scale(0.92);
  }

  .func {
    background: #a5a5b5;
    color: #1e1e2f;
  }

  .operator {
    background: #ff9f0a;
    color: #fff;
    font-size: 26px;
  }

  .operator.active {
    background: #fff;
    color: #ff9f0a;
  }

  .zero {
    grid-column: span 2;
    border-radius: 31px;
    text-align: left;
    padding-left: 24px;
  }

  .equals {
    background: #ff9f0a;
    font-size: 26px;
  }
</style>
</head>
<body>
<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="buttons">
    <button class="func" data-action="clear">AC</button>
    <button class="func" data-action="toggle-sign">±</button>
    <button class="func" data-action="percent">%</button>
    <button class="operator" data-operator="÷">÷</button>

    <button data-number="7">7</button>
    <button data-number="8">8</button>
    <button data-number="9">9</button>
    <button class="operator" data-operator="×">×</button>

    <button data-number="4">4</button>
    <button data-number="5">5</button>
    <button data-number="6">6</button>
    <button class="operator" data-operator="-">−</button>

    <button data-number="1">1</button>
    <button data-number="2">2</button>
    <button data-number="3">3</button>
    <button class="operator" data-operator="+">+</button>

    <button class="zero" data-number="0">0</button>
    <button data-number=".">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script>
  const expressionEl = document.getElementById('expression');
  const resultEl = document.getElementById('result');

  // 状态
  let currentInput = '0';      // 当前输入的数字
  let previousInput = null;    // 前一个数字
  let operator = null;         // 当前运算符
  let waitingForOperand = false; // 是否等待输入下一个数字
  let expressionText = '';     // 顶部表达式

  // 更新显示
  function updateDisplay() {
    resultEl.textContent = currentInput;
    expressionEl.textContent = expressionText;
  }

  // 格式化数字（避免浮点误差，控制长度）
  function formatNumber(num) {
    if (!isFinite(num)) return '错误';
    // 处理浮点精度
    let str = String(parseFloat(num.toPrecision(12)));
    // 限制显示长度
    if (str.replace('-', '').replace('.', '').length > 12) {
      str = parseFloat(num).toExponential(6);
    }
    return str;
  }

  // 清空所有
  function clearAll() {
    currentInput = '0';
    previousInput = null;
    operator = null;
    waitingForOperand = false;
    expressionText = '';
    updateDisplay();
    clearActiveOperator();
  }

  // 输入数字
  function inputDigit(digit) {
    if (waitingForOperand) {
      currentInput = digit;
      waitingForOperand = false;
    } else {
      if (digit === '.' && currentInput.includes('.')) return;
      if (currentInput === '0' && digit !== '.') {
        currentInput = digit;
      } else {
        currentInput += digit;
      }
    }
    updateDisplay();
  }

  // 输入小数点
  function inputDecimal() {
    if (waitingForOperand) {
      currentInput = '0.';
      waitingForOperand = false;
      updateDisplay();
      return;
    }
    if (!currentInput.includes('.')) {
      currentInput += '.';
    }
    updateDisplay();
  }

  // 处理运算符
  function handleOperator(nextOperator) {
    const inputValue = parseFloat(currentInput);

    // 如果已经有运算符并且等待输入，直接替换运算符
    if (operator && waitingForOperand) {
      operator = nextOperator;
      expressionText = previousInput + ' ' + operator + ' ';
      updateDisplay();
      highlightOperator(nextOperator);
      return;
    }

    if (previousInput === null) {
      previousInput = inputValue;
    } else if (operator) {
      const result = calculate(previousInput, inputValue, operator);
      if (result === '错误') {
        clearAll();
        resultEl.textContent = '错误';
        return;
      }
      currentInput = String(result);
      previousInput = result;
    }

    waitingForOperand = true;
    operator = nextOperator;
    expressionText = previousInput + ' ' + operator + ' ';
    highlightOperator(nextOperator);
    updateDisplay();
  }

  // 计算
  function calculate(a, b, op) {
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '×': return a * b;
      case '÷':
        if (b === 0) return '错误';
        return a / b;
      default: return b;
    }
  }

  // 等号
  function handleEquals() {
    if (operator === null || waitingForOperand) return;
    const inputValue = parseFloat(currentInput);
    const result = calculate(previousInput, inputValue, operator);
    if (result === '错误') {
      clearAll();
      resultEl.textContent = '错误';
      return;
    }
    expressionText = previousInput + ' ' + operator + ' ' + inputValue + ' =';
    currentInput = formatNumber(result);
    previousInput = null;
    operator = null;
    waitingForOperand = true;
    clearActiveOperator();
    updateDisplay();
  }

  // 正负号切换
  function toggleSign() {
    if (currentInput === '0') return;
    currentInput = currentInput.startsWith('-')
      ? currentInput.slice(1)
      : '-' + currentInput;
    updateDisplay();
  }

  // 百分比
  function percent() {
    const value = parseFloat(currentInput) / 100;
    currentInput = formatNumber(value);
    updateDisplay();
  }

  // 高亮当前运算符按钮
  function highlightOperator(op) {
    document.querySelectorAll('.operator').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.operator === op);
    });
  }

  function clearActiveOperator() {
    document.querySelectorAll('.operator').forEach(btn => {
      btn.classList.remove('active');
    });
  }

  // 按钮事件
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const number = btn.dataset.number;
      const action = btn.dataset.action;
      const op = btn.dataset.operator;

      if (number === '.') {
        inputDecimal();
      } else if (number !== undefined) {
        inputDigit(number);
      } else if (op !== undefined) {
        handleOperator(op);
      } else if (action === 'clear') {
        clearAll();
      } else if (action === 'toggle-sign') {
        toggleSign();
      } else if (action === 'percent') {
        percent();
      } else if (action === 'equals') {
        handleEquals();
      }
    });
  });

  // 键盘支持
  document.addEventListener('keydown', (e) => {
    const key = e.key;

    if (key >= '0' && key <= '9') {
      inputDigit(key);
    } else if (key === '.') {
      inputDecimal();
    } else if (key === '+' || key === '-') {
      handleOperator(key);
    } else if (key === '*') {
      handleOperator('×');
    } else if (key === '/') {
      e.preventDefault();
      handleOperator('÷');
    } else if (key === 'Enter' || key === '=') {
      e.preventDefault();
      handleEquals();
    } else if (key === 'Escape') {
      clearAll();
    } else if (key === 'Backspace') {
      // 退格删除
      if (!waitingForOperand && currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
        if (currentInput === '' || currentInput === '-') {
          currentInput = '0';
        }
        updateDisplay();
      }
    } else if (key === '%') {
      percent();
    }
  });

  // 初始化
  updateDisplay();
</script>
</body>
</html>
